name: Distribute (pre-)release
run-name: Distribute ${{ github.ref_name }}
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      # Pre-releases: same as releases, but not tagged as 'latest' on Docker Hub
      - v[0-9]+.[0-9]+.[0-9]+a[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+b[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+rc[0-9]+
jobs:
  build-and-check:
    uses: ./.github/workflows/build-and-check.yml
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]'

  publish-on-pypi:
    runs-on: ubuntu-latest
    needs:
      - build-and-check
    environment:
      name: pypi
      url: https://pypi.org/p/lincs
    permissions:
      id-token: write
    steps:
      - name: Download the source distribution from GitHub Actions artifacts
        uses: actions/download-artifact@v8
        with:
          name: source-dist
          path: dist
      - name: Download the wheels from GitHub Actions artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-dist-*
          merge-multiple: true
          path: dist
      - name: Publish all distributions to the Python Package Index
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verify-metadata: false
          verbose: true

  publish-on-dockerhub:
    runs-on: ubuntu-latest
    needs:
      - build-and-check
    env:
      IS_FINAL_RELEASE: ${{ !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') }}
    steps:
      - name: Get the code (just for the Dockerfile)
        uses: actions/checkout@v7
      - name: Download the wheels from GitHub Actions artifacts
        uses: actions/download-artifact@v8
        with:
          name: wheel-dist-3.13-linux
          path: docker
      - name: Build the Docker image
        run: docker build --pull --no-cache --build-arg lincs_version=$(echo ${{ github.ref_name }} | sed 's/^v//') --tag jacquev6/lincs:$(echo ${{ github.ref_name }} | sed 's/^v//') docker
      - if: env.IS_FINAL_RELEASE == 'true'
        run: docker tag jacquev6/lincs:$(echo ${{ github.ref_name }} | sed 's/^v//') jacquev6/lincs:latest
      - name: Login into Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD_JACQUEV6 }}" | docker login -u jacquev6 --password-stdin
      - name: Push the Docker image
        run: docker push jacquev6/lincs:$(echo ${{ github.ref_name }} | sed 's/^v//')
      - if: env.IS_FINAL_RELEASE == 'true'
        run: docker push jacquev6/lincs:latest
